<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How a request travels through ASP.NET Core</title>
<style>
  :root{
    --shaft:#13212C; --panel:#1B2C39; --edge:#2A3F50; --edge2:#3A5062;
    --req:#E86A17; --res:#2FA98C; --warn:#F0A79E;
    --text:#E3EBF1; --muted:#8AA0B0; --dim:#5C7286;
    --sans:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--shaft); color:var(--text); font-family:var(--sans);
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }

  header{
    padding:18px 26px 14px; border-bottom:1px solid var(--edge);
    display:flex; align-items:baseline; gap:20px; flex-wrap:wrap;
  }
  h1{margin:0; font-size:19px; font-weight:650; letter-spacing:-.01em}
  header .sub{color:var(--muted); font-size:13.5px}
  header .count{
    margin-left:auto; font-family:var(--mono); font-size:13px; color:var(--muted);
    border:1px solid var(--edge2); border-radius:3px; padding:3px 10px;
  }

  main{flex:1; display:grid; grid-template-columns:minmax(340px,1fr) minmax(380px,1.05fr); gap:0; min-height:0}

  /* ---------- browser + wire + server ---------- */
  .band{
    display:grid; grid-template-columns:minmax(240px,1fr) minmax(140px,210px) auto;
    align-items:center; gap:20px;
    padding:15px 26px; border-bottom:1px solid var(--edge); background:#101B24;
  }

  .browser{border:1px solid var(--edge2); border-radius:6px; overflow:hidden; background:#0E1922; max-width:420px}
  .chrome{display:flex; align-items:center; gap:6px; padding:7px 10px; background:var(--panel); border-bottom:1px solid var(--edge)}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--edge2); flex:none}
  .addr{
    flex:1; margin-left:6px; background:#0E1922; border:1px solid var(--edge); border-radius:20px;
    padding:3px 11px; font-family:var(--mono); font-size:11.5px; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .viewport{height:108px; padding:11px 14px; font-family:var(--mono); font-size:12px; overflow:hidden}
  .vp-idle,.vp-wait{color:var(--dim); font-family:var(--sans); font-size:13px; text-align:center; padding-top:28px}
  .vp-wait{color:var(--muted)}
  .bar{margin:11px auto 0; width:62%; height:3px; border-radius:2px; background:var(--edge); overflow:hidden}
  .bar i{display:block; height:100%; width:38%; background:var(--req); animation:slide 1.1s linear infinite}
  @keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
  .vp-json{color:#CFDCE6; line-height:1.5}
  .vp-json .k{color:#8FB8D6}
  .vp-json .v{color:#9CCFA0}

  .wire{text-align:center}
  .wire-label{font-family:var(--mono); font-size:11px; color:var(--muted); height:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .wire-line{position:relative; height:2px; margin:9px 0; background:var(--edge)}
  .wire-dot{
    position:absolute; top:-5px; left:0; margin-left:-6px; width:12px; height:12px; border-radius:50%;
    background:var(--req); box-shadow:0 0 0 4px rgba(232,106,23,.18);
    transition:left .65s cubic-bezier(.4,.05,.2,1), background .3s, box-shadow .3s, opacity .3s;
  }
  .wire-dot.res{background:var(--res); box-shadow:0 0 0 4px rgba(47,169,140,.18)}
  .wire-dot.off{opacity:0}
  .wire-sub{font-family:var(--mono); font-size:10.5px; color:var(--dim); height:14px}

  .server{display:flex; align-items:center; gap:13px}
  .rack{flex:none}
  .leds circle{fill:var(--edge2); transition:fill .3s}
  .server.live .leds circle{fill:var(--res)}
  .server.busy .leds circle{fill:var(--req); animation:blink 1.05s steps(1,end) infinite}
  .server.busy .leds circle:nth-child(2){animation-delay:.35s}
  .server.busy .leds circle:nth-child(3){animation-delay:.7s}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.2}}
  .srv-title{font-size:14.5px; font-weight:650}
  .srv-port{font-family:var(--mono); font-size:11px; color:var(--dim); margin-top:1px}
  .srv-stage{
    margin-top:8px; font-family:var(--mono); font-size:11.5px; display:inline-block;
    border-radius:3px; padding:2px 8px; max-width:160px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    color:var(--req); border:1px solid rgba(232,106,23,.32); background:rgba(232,106,23,.1);
  }
  .srv-stage.quiet{color:var(--dim); border-color:var(--edge2); background:transparent}
  .srv-stage.res{color:var(--res); border-color:rgba(47,169,140,.32); background:rgba(47,169,140,.1)}

  /* ---------- the shaft ---------- */
  .shaft{padding:20px 26px 28px; overflow-y:auto; position:relative}
  .rail{position:absolute; left:44px; top:34px; bottom:34px; width:2px; background:var(--edge)}
  .packet{
    position:absolute; left:36px; top:0; width:18px; height:18px; border-radius:50%;
    background:var(--req); box-shadow:0 0 0 5px rgba(232,106,23,.18);
    transition:transform .45s cubic-bezier(.4,.05,.2,1), background .3s, box-shadow .3s;
    z-index:3;
  }
  .packet.res{background:var(--res); box-shadow:0 0 0 5px rgba(47,169,140,.18)}
  .packet.hidden{opacity:0}

  .stage{
    position:relative; margin-left:34px; padding:9px 14px 9px 30px;
    border-left:2px solid transparent; border-radius:0 4px 4px 0;
    opacity:.38; transition:opacity .3s, background .3s, border-color .3s;
  }
  .stage .name{font-family:var(--mono); font-size:13.5px; letter-spacing:-.01em}
  .stage .role{font-size:12.5px; color:var(--muted); margin-top:1px}
  .stage.visited{opacity:.72}
  .stage.active{
    opacity:1; background:var(--panel); border-left-color:var(--req);
  }
  .stage.active.res{border-left-color:var(--res)}
  .stage.active .role{color:var(--text)}
  .group{
    margin:14px 0 6px 34px; padding-left:30px; font-size:11.5px;
    color:var(--dim); letter-spacing:.06em; text-transform:uppercase;
  }

  /* ---------- detail ---------- */
  .detail{
    border-left:1px solid var(--edge); padding:22px 26px 26px;
    display:flex; flex-direction:column; gap:14px; overflow-y:auto; min-height:0;
  }
  .tag{
    display:inline-block; font-family:var(--mono); font-size:11.5px;
    padding:2px 8px; border-radius:3px; align-self:flex-start;
    background:rgba(232,106,23,.14); color:var(--req); border:1px solid rgba(232,106,23,.3);
  }
  .tag.res{background:rgba(47,169,140,.14); color:var(--res); border-color:rgba(47,169,140,.3)}
  h2{margin:0; font-size:21px; font-weight:650; letter-spacing:-.015em}
  .what{margin:0; color:var(--muted); max-width:62ch}
  .what strong{color:var(--text); font-weight:600}

  pre{
    margin:0; background:#0E1922; border:1px solid var(--edge); border-left:3px solid var(--edge2);
    border-radius:0 4px 4px 0; padding:13px 15px; overflow-x:auto;
    font-family:var(--mono); font-size:12.5px; line-height:1.6; color:#CFDCE6;
  }
  pre .c{color:#6F8798}
  pre .k{color:var(--req)}
  pre .s{color:#9CCFA0}

  .note{
    border:1px solid rgba(240,167,158,.35); background:rgba(240,167,158,.07);
    border-radius:4px; padding:11px 14px; font-size:13px; color:#F3C4BD;
  }
  .note b{color:var(--warn)}

  .ctx{border:1px solid var(--edge); border-radius:4px; padding:12px 14px; margin-top:auto}
  .ctx h3{
    margin:0 0 8px; font-family:var(--mono); font-size:12px; font-weight:500;
    color:var(--dim); letter-spacing:.04em;
  }
  .ctx ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:5px}
  .ctx li{font-family:var(--mono); font-size:12.5px; color:var(--muted); display:flex; gap:9px}
  .ctx li span:first-child{color:var(--res); flex:none}
  .ctx .empty{color:var(--dim); font-style:italic; font-family:var(--sans); font-size:13px}

  /* ---------- controls ---------- */
  footer{
    border-top:1px solid var(--edge); padding:12px 26px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  button{
    font:inherit; font-size:13.5px; color:var(--text); background:var(--panel);
    border:1px solid var(--edge2); border-radius:4px; padding:7px 15px; cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  button:hover:not(:disabled){background:var(--edge); border-color:var(--dim)}
  button:disabled{opacity:.35; cursor:default}
  button.primary{background:var(--req); border-color:var(--req); color:#fff; font-weight:600; min-width:92px}
  button.primary:hover{background:#F2792C; border-color:#F2792C}
  button:focus-visible{outline:2px solid var(--res); outline-offset:2px}
  .hint{margin-left:auto; color:var(--dim); font-size:12.5px}
  .hint kbd{
    font-family:var(--mono); font-size:11.5px; border:1px solid var(--edge2);
    border-radius:3px; padding:1px 5px; color:var(--muted);
  }

  @media (max-width:880px){
    main{grid-template-columns:1fr; grid-template-rows:auto auto}
    .detail{border-left:0; border-top:1px solid var(--edge)}
    .hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .packet{transition:none}
    *{transition-duration:.01ms !important}
  }
  .modes{display:flex; gap:0; border:1px solid var(--edge2); border-radius:4px; overflow:hidden}
  .mode{
    font:inherit; font-size:12.5px; color:var(--muted); background:transparent;
    border:0; border-right:1px solid var(--edge2); padding:5px 12px; cursor:pointer;
    transition:background .15s, color .15s;
  }
  .mode:last-child{border-right:0}
  .mode:hover{background:var(--panel); color:var(--text)}
  .mode.on{background:var(--req); color:#fff; font-weight:600}
  .mode:focus-visible{outline:2px solid var(--res); outline-offset:-2px}
</style>
</head>
<body>

<header>
  <h1>How a request travels through ASP.NET Core</h1>
  <span class="sub">GET /products/10</span>
  <div class="modes" role="group" aria-label="Hosting model">
    <button class="mode on" data-m="kestrel">Kestrel only</button>
    <button class="mode" data-m="inproc">IIS in-process</button>
    <button class="mode" data-m="outproc">IIS out-of-process</button>
  </div>
  <span class="count" id="count">1 / 16</span>
</header>

<section class="band">
  <div class="browser">
    <div class="chrome">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <div class="addr" id="addr">about:blank</div>
    </div>
    <div class="viewport" id="viewport"></div>
  </div>

  <div class="wire">
    <div class="wire-label" id="wireLabel"></div>
    <div class="wire-line"><div class="wire-dot off" id="wireDot"></div></div>
    <div class="wire-sub" id="wireSub"></div>
  </div>

  <div class="server" id="server">
    <svg class="rack" viewBox="0 0 96 84" width="74" height="65" aria-hidden="true">
      <g fill="#1B2C39" stroke="#3A5062" stroke-width="1.2">
        <rect x="4" y="4"  width="88" height="22" rx="3"/>
        <rect x="4" y="31" width="88" height="22" rx="3"/>
        <rect x="4" y="58" width="88" height="22" rx="3"/>
      </g>
      <g fill="#2A3F50">
        <rect x="13" y="11" width="32" height="2.5" rx="1.2"/><rect x="13" y="17" width="22" height="2.5" rx="1.2"/>
        <rect x="13" y="38" width="32" height="2.5" rx="1.2"/><rect x="13" y="44" width="22" height="2.5" rx="1.2"/>
        <rect x="13" y="65" width="32" height="2.5" rx="1.2"/><rect x="13" y="71" width="22" height="2.5" rx="1.2"/>
      </g>
      <g class="leds">
        <circle cx="80" cy="15" r="3.2"/>
        <circle cx="80" cy="42" r="3.2"/>
        <circle cx="80" cy="69" r="3.2"/>
      </g>
    </svg>
    <div>
      <div class="srv-title">Kestrel</div>
      <div class="srv-port">localhost:5001</div>
      <div class="srv-stage quiet" id="srvStage">not started</div>
    </div>
  </div>
</section>

<main>
  <section class="shaft" id="shaft">
    <div class="rail"></div>
    <div class="packet hidden" id="packet"></div>
    <div id="stages"></div>
  </section>

  <section class="detail">
    <span class="tag" id="tag">Request</span>
    <h2 id="title"></h2>
    <p class="what" id="what"></p>
    <pre id="code"></pre>
    <div class="note" id="note" hidden></div>
    <div class="ctx">
      <h3>HttpContext</h3>
      <ul id="ctxlist"><li class="empty">Not created yet.</li></ul>
    </div>
  </section>
</main>

<footer>
  <button id="prev">Back</button>
  <button class="primary" id="play">Play</button>
  <button id="next">Next</button>
  <button id="reset">Start again</button>
  <span class="hint"><kbd>←</kbd> <kbd>→</kbd> to step, <kbd>space</kbd> to play</span>
</footer>

<script>
const BASE_STAGES = [
  {k:'browser', n:'Browser',            r:'The user opens a page'},
  {k:'kestrel', n:'Kestrel',            r:'The web server. Speaks HTTP.', g:'Server'},
  {k:'https',   n:'UseHttpsRedirection',r:'Forces HTTPS', g:'Middleware pipeline'},
  {k:'static',  n:'UseStaticFiles',     r:'Serves files from wwwroot, or passes on'},
  {k:'routing', n:'UseRouting',         r:'Matches the URL to an endpoint'},
  {k:'authn',   n:'UseAuthentication',  r:'Works out who the caller is'},
  {k:'authz',   n:'UseAuthorization',   r:'Decides whether they may proceed'},
  {k:'binding', n:'Model binding',      r:'Route values become typed arguments', g:'Your code'},
  {k:'ctrl',    n:'ProductsController', r:'Handles the HTTP concern only'},
  {k:'svc',     n:'ProductService',     r:'Holds the business rules'},
  {k:'ef',      n:'EF Core',            r:'Turns LINQ into SQL'},
  {k:'db',      n:'SQL Server',         r:'Returns the rows', g:'Data'}
];

const BASE_S = [
  { st:null, dir:'req', t:'The application starts',
    w:'<strong>dotnet run</strong> builds your app and starts Kestrel, the web server that ships with ASP.NET Core. It binds to a port and waits. Nothing else happens until a request arrives.',
    c:`<span class="k">var</span> builder = WebApplication.CreateBuilder(args);
<span class="k">var</span> app = builder.Build();

app.Run();   <span class="c">// Kestrel is now listening on :5001</span>` },

  { st:'browser', dir:'req', t:'The browser sends a request',
    w:'A request is only ever four things: a <strong>verb</strong>, a <strong>path</strong>, some <strong>headers</strong>, and sometimes a <strong>body</strong>. Nothing more mysterious is happening.',
    c:`GET /products/10 HTTP/1.1
Host: example.com
Accept: application/json` },

  { st:'kestrel', dir:'req', t:'Kestrel accepts the connection',
    w:'Kestrel parses the raw bytes into something your code can work with, and the hosting layer builds an <strong>HttpContext</strong> — one box holding everything about this request and the response that will go back.',
    c:`HttpContext
├── Request   <span class="c">// URL, method, headers, body</span>
└── Response  <span class="c">// status, headers, body (empty for now)</span>`,
    ctx:['Request.Method = GET','Request.Path = /products/10'] },

  { st:'https', dir:'req', t:'HTTPS redirection',
    w:'The first checkpoint. If the request arrived over plain HTTP it is answered here with a <strong>307 redirect</strong> and never travels any further. Middleware can end a request early — that is the point of a pipeline.',
    c:`app.UseHttpsRedirection();

<span class="c">// arrived on https already — pass it along</span>` },

  { st:'static', dir:'req', t:'Static files',
    w:'If the path matched a real file in <strong>wwwroot</strong> — a stylesheet, an image, the built React bundle — it would be sent straight back from here and your controller would never run. That is why static files are fast.',
    c:`app.UseStaticFiles();

<span class="c">// /products/10 is not a file — keep going</span>` },

  { st:'routing', dir:'req', t:'Routing matches an endpoint',
    w:'Routing compares the path against every registered route, finds the winner, and attaches the matched <strong>endpoint and its metadata</strong> to the HttpContext. The route values are extracted here, still as strings.',
    c:`[<span class="k">Route</span>(<span class="s">"products"</span>)]
<span class="k">public class</span> ProductsController : ControllerBase
{
    [<span class="k">HttpGet</span>(<span class="s">"{id}"</span>)]
    <span class="k">public</span> IActionResult Get(<span class="k">int</span> id) { ... }
}

<span class="c">// matched. id = "10"</span>`,
    note:'<b>Routing runs before authentication and authorization</b>, not after. Authorization has to know which endpoint matched in order to read its [Authorize] attribute. Put UseRouting last and [Authorize] silently does nothing.',
    ctx:['Endpoint = ProductsController.Get','RouteValues["id"] = "10"'] },

  { st:'authn', dir:'req', t:'Authentication: who is this?',
    w:'The cookie or bearer token is read and turned into a <strong>ClaimsPrincipal</strong> on the context. This step only establishes identity. It never decides whether anyone is allowed to do anything.',
    c:`app.UseAuthentication();

<span class="c">// User.Identity.Name = "kpillai"</span>
<span class="c">// User.IsAuthenticated = true</span>`,
    ctx:['User = kpillai','User.IsAuthenticated = true'] },

  { st:'authz', dir:'req', t:'Authorization: may they?',
    w:'Now the [Authorize] attribute on the endpoint routing found is evaluated against those claims. Fail here and the request stops with <strong>401</strong> or <strong>403</strong> — your controller is never reached.',
    c:`app.UseAuthorization();

<span class="c">// endpoint requires role "Stores"</span>
<span class="c">// user has it — proceed</span>` },

  { st:'binding', dir:'req', t:'Model binding and validation',
    w:'The route value <strong>"10"</strong> is a string. Model binding converts it to the <strong>int</strong> your method declares, runs any validation attributes, and asks the container to construct the controller with its dependencies.',
    c:`<span class="c">// "10"  →  10</span>
<span class="c">// container builds the controller:</span>

<span class="k">public</span> ProductsController(IProductService svc)
    => _svc = svc;`,
    ctx:['id = 10  (int)','ModelState.IsValid = true'] },

  { st:'ctrl', dir:'req', t:'Your action runs',
    w:'Finally, your C# executes. A controller should stay thin — take the request, call a service, choose a result. No business rules and no SQL live here.',
    c:`<span class="k">public async Task</span>&lt;IActionResult&gt; Get(<span class="k">int</span> id)
{
    <span class="k">var</span> product = <span class="k">await</span> _svc.GetProductAsync(id);

    <span class="k">return</span> product <span class="k">is null</span>
        ? NotFound()
        : Ok(product);
}` },

  { st:'svc', dir:'req', t:'The service applies the rules',
    w:'The layer worth testing, and the layer that survives a rewrite of the interface. It knows nothing about HTTP — which is exactly why you can test it without a web server.',
    c:`<span class="k">public async Task</span>&lt;Product&gt; GetProductAsync(<span class="k">int</span> id)
    => <span class="k">await</span> _repo.FindAsync(id);` },

  { st:'ef', dir:'req', t:'EF Core writes the SQL',
    w:'Your LINQ is translated into parameterised SQL. Parameterised is the important word — it is why an ORM closes the injection hole by default.',
    c:`<span class="k">await</span> _db.Products.FirstOrDefaultAsync(p => p.Id == id);

<span class="c">-- becomes --</span>
SELECT TOP(1) [p].[Id], [p].[Name], [p].[Price]
FROM [Products] AS [p]
WHERE [p].[Id] = @__id_0` },

  { st:'db', dir:'res', t:'The database answers',
    w:'One row comes back and EF Core materialises it into a <strong>Product</strong> object. This is the turning point — from here everything travels back the way it came.',
    c:`Id    Name      Price
10    Laptop    50000

<span class="c">// → new Product { Id = 10, ... }</span>` },

  { st:'ctrl', dir:'res', t:'The result becomes a response',
    w:'<strong>Ok(product)</strong> is not the response — it is a description of one. ASP.NET Core serialises the object to JSON, sets the status code, and sets the content type.',
    c:`<span class="k">return</span> Ok(product);

<span class="c">// serialised, camelCase by default</span>
{ <span class="s">"id"</span>: 10, <span class="s">"name"</span>: <span class="s">"Laptop"</span>, <span class="s">"price"</span>: 50000 }`,
    ctx:['Response.StatusCode = 200','Response.Body = { ... }'] },

  { st:'https', dir:'res', t:'Back out through the pipeline',
    w:'The pipeline is not a list, it is a <strong>pipe</strong>. The response passes back through every middleware in reverse order, and each one gets a chance to act on it — adding headers, compressing, logging how long it all took.',
    c:`<span class="c">// on the way in:</span>
HTTPS → StaticFiles → Routing → AuthN → AuthZ → endpoint

<span class="c">// on the way back out:</span>
endpoint → AuthZ → AuthN → Routing → StaticFiles → HTTPS` },

  { st:'browser', dir:'res', t:'Kestrel writes it to the wire',
    w:'Kestrel turns the HttpContext response back into bytes and sends them. The browser receives JSON and renders the page. The HttpContext is then discarded — the next request starts with a brand new one.',
    c:`HTTP/1.1 200 OK
Content-Type: application/json

{ <span class="s">"id"</span>: 10, <span class="s">"name"</span>: <span class="s">"Laptop"</span>, <span class="s">"price"</span>: 50000 }

<span class="c">// server keeps nothing. Every request stands alone.</span>` }
];

const MODES = {
  kestrel: {
    title:'Kestrel', port:'localhost:5001',
    front:[],
    server:{ n:'Kestrel', r:'The web server. Speaks HTTP directly.' },
    start:{
      t:'The application starts',
      w:'<strong>dotnet run</strong> starts your app and Kestrel, the web server built into ASP.NET Core. It binds to a port and waits. This is what you get in development, and what runs behind Nginx or a load balancer on Linux.',
      c:`<span class="k">var</span> builder = WebApplication.CreateBuilder(args);
<span class="k">var</span> app = builder.Build();

app.Run();   <span class="c">// Kestrel is listening on :5001</span>` },
    accept:{
      t:'Kestrel accepts the connection',
      w:'Kestrel parses the raw bytes into something your code can work with, and the hosting layer builds an <strong>HttpContext</strong> — one box holding everything about this request and the response that will go back.' }
  },

  inproc: {
    title:'IIS · w3wp.exe', port:'in-process',
    front:[
      {k:'httpsys', n:'HTTP.sys',            r:'Kernel-mode listener', g:'Windows'},
      {k:'iis',     n:'IIS · w3wp.exe',      r:'The worker process'},
      {k:'ancm',    n:'ASP.NET Core Module', r:'Loads the .NET runtime inside w3wp'}
    ],
    server:{ n:'IISHttpServer', r:'Runs inside w3wp. Kestrel is not used.' },
    start:{
      t:'IIS starts your application',
      w:'The ASP.NET Core Module loads the .NET runtime <strong>inside the IIS worker process</strong>. There is no second process, no local port, and — this surprises people — <strong>no Kestrel at all</strong>. The server implementation is IISHttpServer.',
      c:`<span class="c">&lt;!-- web.config, generated by publish --&gt;</span>
&lt;aspNetCore processPath=<span class="s">"dotnet"</span>
            arguments=<span class="s">".\\App.dll"</span>
            hostingModel=<span class="s">"inprocess"</span> /&gt;

<span class="c">// this is the default since ASP.NET Core 2.2</span>` },
    extra:{
      st:'ancm', dir:'req', t:'IIS hands the request straight over',
      w:'HTTP.sys receives the connection in kernel mode and passes it to the IIS worker process. The module then hands the request <strong>directly</strong> to your application in the same process — no second HTTP hop, which is why in-process is the faster option.',
      c:`HTTP.sys  →  w3wp.exe  →  ANCM  →  your app

<span class="c">// all inside one process</span>` },
    accept:{
      t:'IISHttpServer creates the HttpContext',
      w:'Everything from here is <strong>identical</strong> to running under Kestrel. Only the server implementation differs — your middleware, routing and controllers cannot tell the difference and do not need to.' }
  },

  outproc: {
    title:'dotnet.exe', port:'127.0.0.1:random',
    front:[
      {k:'httpsys', n:'HTTP.sys',            r:'Kernel-mode listener', g:'Windows'},
      {k:'iis',     n:'IIS · w3wp.exe',      r:'Acts as a reverse proxy'},
      {k:'ancm',    n:'ASP.NET Core Module', r:'Forwards over a local port'}
    ],
    server:{ n:'Kestrel', r:'In a separate dotnet.exe process' },
    start:{
      t:'IIS starts a second process',
      w:'The module launches <strong>dotnet.exe</strong> running Kestrel on a random localhost port, and IIS then proxies every request to it over HTTP. Two processes, two HTTP hops. Needed when the app must run under a different account or runtime.',
      c:`&lt;aspNetCore processPath=<span class="s">"dotnet"</span>
            arguments=<span class="s">".\\App.dll"</span>
            hostingModel=<span class="s">"outofprocess"</span> /&gt;

<span class="c">// ANCM assigns ASPNETCORE_PORT at startup</span>` },
    extra:{
      st:'ancm', dir:'req', t:'IIS proxies it to Kestrel',
      w:'The module forwards the request over a <strong>second HTTP call</strong> to 127.0.0.1. Kestrel now sees a request that came from the proxy, not from the browser.',
      c:`browser → HTTP.sys → w3wp.exe → 127.0.0.1:5432 → Kestrel

<span class="c">// without UseForwardedHeaders your app sees</span>
<span class="c">// RemoteIpAddress = 127.0.0.1 and Scheme = http</span>`,
      note:'<b>Add UseForwardedHeaders out-of-process.</b> Otherwise Request.Scheme reports http even on an HTTPS site, and every client IP in your logs is 127.0.0.1.' },
    accept:{
      t:'Kestrel accepts the proxied request',
      w:'Kestrel builds the <strong>HttpContext</strong> exactly as it would in development. From here the pipeline is identical in all three hosting models.' }
  }
};

let STAGES = [], S = [], nodes = {};
const stagesEl = document.getElementById('stages');

function buildStages() {
  stagesEl.innerHTML = '';
  nodes = {};
  STAGES.forEach(s => {
    if (s.g) {
      const g = document.createElement('div');
      g.className = 'group'; g.textContent = s.g;
      stagesEl.appendChild(g);
    }
    const d = document.createElement('div');
    d.className = 'stage';
    d.innerHTML = `<div class="name">${s.n}</div><div class="role">${s.r}</div>`;
    stagesEl.appendChild(d);
    (nodes[s.k] = nodes[s.k] || []).push(d);
  });
}

function applyMode(key) {
  const m = MODES[key];

  STAGES = [ BASE_STAGES[0], ...m.front,
             { ...BASE_STAGES[1], ...m.server },
             ...BASE_STAGES.slice(2) ];

  S = BASE_S.map(x => ({ ...x }));
  S[0] = { ...S[0], ...m.start };
  S[2] = { ...S[2], ...m.accept };
  if (m.extra) S.splice(2, 0, m.extra);

  document.querySelector('.srv-title').textContent = m.title;
  document.querySelector('.srv-port').textContent  = m.port;
  document.querySelectorAll('.mode').forEach(b =>
    b.classList.toggle('on', b.dataset.m === key));

  buildStages();
  stop();
  go(0);
}

const packet = document.getElementById('packet');
const shaft  = document.getElementById('shaft');
let i = 0, timer = null;

function render() {
  const step = S[i];
  const idx  = STAGES.findIndex(s => s.k === step.st);
  const res  = step.dir === 'res';

  STAGES.forEach((s, n) => {
    const el = nodes[s.k][0];
    el.classList.toggle('active', s.k === step.st);
    el.classList.toggle('res', res);
    el.classList.toggle('visited', !res ? n < idx : n > idx);
  });

  if (idx >= 0) {
    const el = nodes[step.st][0];
    packet.classList.remove('hidden');
    packet.classList.toggle('res', res);
    packet.style.transform =
      `translateY(${el.offsetTop + el.offsetHeight / 2 - 9 - shaft.scrollTop}px)`;
    el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  } else {
    packet.classList.add('hidden');
  }

  const tag = document.getElementById('tag');
  tag.textContent = res ? 'Response' : 'Request';
  tag.classList.toggle('res', res);

  document.getElementById('title').textContent = step.t;
  document.getElementById('what').innerHTML   = step.w;
  document.getElementById('code').innerHTML   = step.c;
  document.getElementById('count').textContent = `${i + 1} / ${S.length}`;

  const note = document.getElementById('note');
  note.hidden = !step.note;
  if (step.note) note.innerHTML = step.note;

  const built = [];
  for (let n = 0; n <= i; n++) if (S[n].ctx) built.push(...S[n].ctx);
  document.getElementById('ctxlist').innerHTML = built.length
    ? built.map(c => {
        const [k, ...v] = c.split(' = ');
        return `<li><span>${k}</span><span>${v.join(' = ') || ''}</span></li>`;
      }).join('')
    : '<li class="empty">Not created yet.</li>';

  renderBand();
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').disabled = i === S.length - 1;
}

const B = {
  addr:  document.getElementById('addr'),
  vp:    document.getElementById('viewport'),
  label: document.getElementById('wireLabel'),
  sub:   document.getElementById('wireSub'),
  dot:   document.getElementById('wireDot'),
  srv:   document.getElementById('server'),
  stage: document.getElementById('srvStage')
};

const JSON_VIEW =
  '<div class="vp-json">{<br>' +
  '&nbsp;&nbsp;<span class="k">"id"</span>: <span class="v">10</span>,<br>' +
  '&nbsp;&nbsp;<span class="k">"name"</span>: <span class="v">"Laptop"</span>,<br>' +
  '&nbsp;&nbsp;<span class="k">"price"</span>: <span class="v">50000</span><br>}</div>';

function renderBand() {
  const step  = S[i];
  const res   = step.dir === 'res';
  const first = i === 0;
  const last  = i === S.length - 1;
  const send  = i === 1;

  B.addr.textContent = first ? 'about:blank' : 'https://example.com/products/10';

  B.vp.innerHTML =
      first ? '<div class="vp-idle">Nothing requested yet</div>'
    : last  ? JSON_VIEW
    :         '<div class="vp-wait">Waiting for example.com<div class="bar"><i></i></div></div>';

  B.dot.classList.toggle('off', first);
  B.dot.classList.toggle('res', res);
  B.dot.style.left = (first || last) ? '0%' : '100%';

  B.label.textContent =
      first ? ''
    : last  ? '200 OK  ·  application/json'
    :         'GET /products/10';

  B.sub.textContent =
      first ? 'listening, no traffic'
    : send  ? 'request travelling to the server'
    : last  ? 'response travelling back'
    :         'connection held open, request in flight';

  B.srv.className = 'server ' + (first || last ? 'live' : 'busy');

  const named = STAGES.find(s => s.k === step.st);
  B.stage.textContent =
      first ? 'listening'
    : send  ? 'connection accepted'
    : last  ? 'response sent'
    : named ? named.n
    :         'processing';

  B.stage.className = 'srv-stage' +
    (first || last ? ' quiet' : res ? ' res' : '');
}

function go(n) {
  i = Math.max(0, Math.min(S.length - 1, n));
  render();
  if (i === S.length - 1) stop();
}
function play() {
  if (i === S.length - 1) i = 0;
  timer = setInterval(() => go(i + 1), 2600);
  document.getElementById('play').textContent = 'Pause';
  render();
}
function stop() {
  clearInterval(timer); timer = null;
  document.getElementById('play').textContent = 'Play';
}

document.getElementById('next').onclick  = () => { stop(); go(i + 1); };
document.getElementById('prev').onclick  = () => { stop(); go(i - 1); };
document.getElementById('reset').onclick = () => { stop(); go(0); };
document.getElementById('play').onclick  = () => timer ? stop() : play();

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { stop(); go(i + 1); }
  if (e.key === 'ArrowLeft')  { stop(); go(i - 1); }
  if (e.key === ' ') { e.preventDefault(); timer ? stop() : play(); }
});

document.querySelectorAll('.mode').forEach(b =>
  b.onclick = () => applyMode(b.dataset.m));

shaft.addEventListener('scroll', render, { passive: true });
window.addEventListener('resize', render);
applyMode('kestrel');
</script>
</body>
</html>
